<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8"
            refX="6" refY="3" orient="auto"
            markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#34495E"/>
    </marker>
  </defs>

  <!-- Flechas superiores -->
  <line x1="16" y1="16" x2="57" y2="57"
        stroke="#34495E" stroke-width="4"
        marker-end="url(#arrow)"/>

  <line x1="112" y1="16" x2="71" y2="57"
        stroke="#34495E" stroke-width="4"
        marker-end="url(#arrow)"/>

  <!-- Cuadrado -> círculo inferior -->
  <line x1="64" y1="64" x2="16" y2="112"
        stroke="#34495E" stroke-width="4"
        marker-end="url(#arrow)"/>

  <!-- Círculo inferior -> hexágono (destino alejado 15%) -->
  <line x1="16" y1="112" x2="98" y2="112"
        stroke="#34495E" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- Cuadrado -> hexágono (destino alejado 15%) -->
  <line x1="64" y1="64" x2="105" y2="105"
        stroke="#34495E" stroke-width="3"
        marker-end="url(#arrow)"/>

  <!-- Círculos -->
  <circle cx="16" cy="16" r="13.2"
          fill="#F1C40F"
          stroke="#2C3E50" stroke-width="3"/>
  <circle cx="112" cy="16" r="13.2"
          fill="#F1C40F"
          stroke="#2C3E50" stroke-width="3"/>
  <circle cx="16" cy="112" r="13.2"
          fill="#F1C40F"
          stroke="#2C3E50" stroke-width="3"/>

  <!-- Etiquetas -->
  <text x="16" y="20"
        font-family="Liberation Sans, Arial"
        font-size="10"
        font-weight="bold"
        text-anchor="middle"
        fill="#1B2631">s1</text>

  <text x="112" y="20"
        font-family="Liberation Sans, Arial"
        font-size="10"
        font-weight="bold"
        text-anchor="middle"
        fill="#1B2631">s2</text>

  <text x="16" y="116"
        font-family="Liberation Sans, Arial"
        font-size="10"
        font-weight="bold"
        text-anchor="middle"
        fill="#1B2631">se</text>

  <!-- Cuadrado central -->
  <rect x="46" y="46" width="36" height="36" rx="6" ry="6"
        fill="#5DADE2"
        stroke="#2C3E50" stroke-width="4"/>

  <text x="64" y="70"
        font-family="Liberation Sans, Arial"
        font-size="18"
        font-weight="bold"
        text-anchor="middle"
        fill="#FFFFFF">OM</text>

  <!-- Hexágono -->
  <polygon
    points="126,112 119,124 105,124 98,112 105,100 119,100"
    fill="#1E8449"
    stroke="#2C3E50"
    stroke-width="3"/>

  <text x="112" y="118"
        font-family="Liberation Sans, Arial"
        font-size="18"
        font-weight="bold"
        text-anchor="middle"
        fill="#FFFFFF">U</text>

</svg>
